<h1>Send a friend a kind word 🌞</h1>
<p>BOM is an iPhone app for sending friends short, ready-made notes of praise — with your name, or anonymously to friends already on BOM.</p>
<p lang="zh-Hant">BOM 讓你用預先寫好的短句讚賞朋友——可以署名，亦可以匿名傳送給已使用 BOM 的朋友。</p>
<p class="muted">In testing in the UK and Hong Kong · 英國及香港測試中</p>
