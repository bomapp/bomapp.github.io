<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOM</title>
<link rel="icon" href="/icon.png">
<meta property="og:title" content="BOM">
<meta property="og:description" content="Send a friend a kind word.">
<meta property="og:image" content="https://bomapp.github.io/og-image.png">
<style>
:root { --bg:#fff; --fg:#1c1c1e; --muted:#6e6e73; --accent:#f39200; --card:#f5f5f7; }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --muted:#a1a1a6; --card:#1c1c1e; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font:17px/1.6 ui-rounded, -apple-system, "PingFang HK", "Noto Sans HK", sans-serif; }
main { max-width:680px; margin:0 auto; padding:32px 16px 64px; }
a { color:var(--accent); }
header { margin-bottom:24px; }
header img { height:40px; width:auto; display:block; }
.hero { position:relative; overflow:hidden; border-radius:24px; padding:72px 24px 64px; margin-bottom:32px;
        text-align:center; background:linear-gradient(#2985d1, #4fb8ed); }
.hero .wordmark { width:min(320px, 70%); position:relative; }
.hero .cloud { position:absolute; filter:drop-shadow(6px 7px 0 rgba(14,76,120,.22)); }
h2 { margin-top:40px; } h3 { margin:28px 0 4px; font-size:18px; }
.muted { color:var(--muted); font-size:15px; }
nav a { margin-right:16px; }
.card { background:var(--card); border-radius:16px; padding:16px 20px; margin:16px 0; }
.code { font:700 34px/1.2 ui-monospace, SFMono-Regular, monospace; letter-spacing:2px; margin:8px 0 12px; }
button { font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:999px; padding:10px 22px; }
</style>
</head>
<body><main>
<header><a href="/"><picture>
<source srcset="/bom-wordmark-white.svg" media="(prefers-color-scheme: dark)">
<img src="/bom-wordmark-blue.svg" alt="BOM"></picture></a></header>

<h1>A friend sent you a BOM<br><span lang="zh-Hant">朋友送了一個 BOM 給你</span></h1>
<div class="card"><p class="code" id="code"></p>
<button id="copy" type="button">Copy code · 複製代碼</button>
<script>
const c = decodeURIComponent(location.hash.slice(1)).toUpperCase();
document.getElementById('code').textContent = c;
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(c)
  .then(() => document.getElementById('copy').textContent = 'Copied · 已複製');
</script></div>
<p>Get BOM, tap <strong>Open a BOM</strong> and enter this code.</p>
<p lang="zh-Hant">下載 BOM 後，按「打開 BOM」並輸入以上代碼。</p>
<p class="muted">BOM is coming soon to the App Store and Google Play · BOM 即將於 App Store 及 Google Play 推出</p>
<footer class="muted" style="margin-top:48px">© 2026 Ho Chung Au and Chun Yin Au. All rights reserved.</footer>
</main></body>
</html>
